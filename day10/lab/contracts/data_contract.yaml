# Data contract — Lab Day 10 (tiếp nối artifact CS + IT Helpdesk)
# Đã điền owner, SLA, allowlist, quality rules — đồng bộ với code.

version: "1.1"
dataset: "kb_chunk_export"
owner_team: "Data Platform / AI Engineering (CS+IT Helpdesk KB)"

schema_cleaned:
  chunk_id:
    type: string
    required: true
    description: "ID ổn định sau clean: doc_id_seq_sha256[:16] (idempotent upsert)"
  doc_id:
    type: string
    required: true
    description: "Khóa logic tài liệu nguồn; phải ∈ allowed_doc_ids"
  chunk_text:
    type: string
    required: true
    constraints:
      min_length: 8
  effective_date:
    type: date
    required: true
    description: "ISO YYYY-MM-DD sau chuẩn hoá (DMY/ được parse)"
  exported_at:
    type: datetime
    required: true
    description: "Dùng cho freshness check"

quality_rules:
  # Baseline
  - id: "no_duplicate_chunk_text"
    severity: "warn"
  - id: "no_stale_refund_window"
    description: "Không để chunk policy refund chứa cửa sổ 14 ngày (lệch so với v4 = 7 ngày)"
    severity: "halt"            # expectations.E3 + cleaning refund fix
  # Mở rộng của nhóm — expectation mới
  - id: "access_control_sop_present"
    description: "Sau clean phải có ≥1 chunk access_control_sop (guard cho allowlist fix)"
    severity: "halt"            # expectations.E7
  - id: "no_internal_email_pii"
    description: "Không rò email @company.internal vào vector store"
    severity: "halt"            # expectations.E8
  - id: "no_noise_marker"
    description: "Không còn tiền tố nhiễu 'Nội dung không rõ ràng:' / '!!!' sau clean"
    severity: "warn"            # expectations.E9
  - id: "hr_leave_no_stale_10d_annual"
    description: "Không còn marker '10 ngày phép năm' (bản HR 2025) sau clean"
    severity: "halt"            # expectations.E6 + cleaning rule R1

freshness:
  measured_at: "publish"  # ingest | cleaned | publish
  sla_hours: 24           # env FRESHNESS_SLA_HOURS override; data mẫu exported_at cũ → FAIL hợp lý
  alert_channel: "#data-quality (Slack) + email data-oncall@company.internal"

canonical_sources:
  - path: "data/docs/policy_refund_v4.txt"
    doc_id: "policy_refund_v4"
  - path: "data/docs/sla_p1_2026.txt"
    doc_id: "sla_p1_2026"
  - path: "data/docs/it_helpdesk_faq.txt"
    doc_id: "it_helpdesk_faq"
  - path: "data/docs/hr_leave_policy.txt"
    doc_id: "hr_leave_policy"
  - path: "data/docs/access_control_sop.txt"
    doc_id: "access_control_sop"

# Allowlist export — đồng bộ với transform/cleaning_rules.ALLOWED_DOC_IDS.
# [FIX] access_control_sop bổ sung so với baseline (thiếu → gq_d10_10 fail).
allowed_doc_ids:
  - policy_refund_v4
  - sla_p1_2026
  - it_helpdesk_faq
  - hr_leave_policy
  - access_control_sop

# Nguồn bị quarantine có chủ đích (không nằm trong corpus canonical Day 08/09):
quarantined_sources:
  - prefix: "invalid_doc_*"      # export lỗi catalog
  - prefix: "legacy_*"           # hệ thống cũ
  - doc_id: "security_policy"    # chưa đăng ký canonical doc
  - doc_id: "data_privacy_guideline"

# Versioning: cutoff đặt ở contract (Merit — tránh hard-code rải rác trong code).
policy_versioning:
  hr_leave_min_effective_date: "2026-01-01"
  hr_leave_stale_markers: ["10 ngày phép năm", "bản HR 2025"]
  refund_canonical_window_days: 7
